<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-wallet"></i>
                <span>Expenze</span>
            </div>
            <ul class="nav-links">
                <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="/profile" class="active"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
            <div class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2>My Profile</h2>
                    <p>Manage your account settings and preferences.</p>
                </div>
                <div class="user-info">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <i class="fas fa-moon" id="theme-icon"></i>
                    </div>
                </div>
            </header>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
                <!-- Profile Info -->
                <div class="card" style="flex-direction: column; align-items: flex-start; border-left: 5px solid var(--primary-color);">
                    <h3 style="margin-bottom: 20px;">Account Details</h3>
                    <div style="margin-bottom: 15px;">
                        <strong style="color: var(--text-secondary)">Name</strong>
                        <p id="profile-name" style="font-size: 1.1rem; color: var(--text-primary); font-weight: 500;">Loading...</p>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <strong style="color: var(--text-secondary)">Email</strong>
                        <p id="profile-email" style="font-size: 1.1rem; color: var(--text-primary); font-weight: 500;">Loading...</p>
                    </div>
                </div>

                <!-- Budget Setting -->
                <div class="card" style="flex-direction: column; align-items: flex-start; border-left: 5px solid var(--warning-color);">
                    <h3 style="margin-bottom: 20px;">Monthly Budget</h3>
                    <form id="budget-form" style="width: 100%;">
                        <div class="form-group">
                            <label>Set Monthly Expense Budget ($)</label>
                            <input type="number" id="budget-amount" class="form-control" step="0.01" min="0">
                            <small style="color: var(--text-secondary); margin-top: 5px; display: block;">We'll warn you if your monthly expenses exceed this amount.</small>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Budget</button>
                    </form>
                </div>

                <!-- Change Password -->
                <div class="card" style="flex-direction: column; align-items: flex-start; border-left: 5px solid var(--danger-color);">
                    <h3 style="margin-bottom: 20px;">Change Password</h3>
                    <form id="password-form" style="width: 100%;">
                        <div class="form-group">
                            <label>Current Password</label>
                            <input type="password" id="current-password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" id="new-password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Change Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/common.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
