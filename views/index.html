<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Login</title>
    <meta name="description" content="Manage your expenses efficiently with our smart expense tracker.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo">
                <i class="fas fa-wallet"></i>
            </div>
            <h2 id="auth-title">Welcome Back</h2>
            
            <form id="auth-form">
                <div class="form-group" id="name-group" style="display: none;">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px;" id="auth-btn">Login</button>
            </form>
            
            <div class="toggle-form">
                <p id="toggle-text">Don't have an account? <span onclick="toggleAuthMode()">Sign up</span></p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/auth.js"></script>
</body>
</html>
