<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="loader-overlay" id="loader" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-wallet"></i>
                <span>Expenze</span>
            </div>
            <ul class="nav-links">
                <li><a href="/dashboard" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="/profile"><i class="fas fa-user"></i> Profile</a></li>
            </ul>
            <div class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div>
                    <h2 id="greeting">Hello, User!</h2>
                    <p>Here's what's happening with your money.</p>
                </div>
                <div class="user-info">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <i class="fas fa-moon" id="theme-icon"></i>
                    </div>
                    <button class="btn btn-primary" onclick="openModal('addTransactionModal')">
                        <i class="fas fa-plus"></i> Add Transaction
                    </button>
                </div>
            </header>

            <!-- Summary Cards -->
            <section class="summary-cards">
                <div class="card income">
                    <div class="card-icon"><i class="fas fa-arrow-up"></i></div>
                    <div class="card-info">
                        <h3>Total Income</h3>
                        <div class="amount" id="total-income">$0.00</div>
                    </div>
                </div>
                <div class="card expense">
                    <div class="card-icon"><i class="fas fa-arrow-down"></i></div>
                    <div class="card-info">
                        <h3>Total Expense</h3>
                        <div class="amount" id="total-expense">$0.00</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon" style="color: var(--primary-color)"><i class="fas fa-balance-scale"></i></div>
                    <div class="card-info">
                        <h3>Current Balance</h3>
                        <div class="amount" id="current-balance">$0.00</div>
                    </div>
                </div>
            </section>

            <!-- Charts -->
            <section class="charts-section">
                <div class="chart-container">
                    <h3>Income vs Expense</h3>
                    <canvas id="overviewChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Expense by Category</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </section>

            <!-- Transactions -->
            <section class="transactions-section">
                <div class="section-header">
                    <h3>Recent Transactions</h3>
                    <button class="btn btn-outline" onclick="exportToCSV()"><i class="fas fa-download"></i> Export CSV</button>
                </div>
                
                <div class="filters">
                    <input type="text" id="search-input" placeholder="Search description..." oninput="debounceFetchTransactions()">
                    <select id="filter-type" onchange="fetchTransactions()">
                        <option value="">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                    <select id="filter-category" onchange="fetchTransactions()">
                        <option value="">All Categories</option>
                    </select>
                    <select id="filter-sort" onchange="fetchTransactions()">
                        <option value="latest">Latest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="highest">Highest Amount</option>
                        <option value="lowest">Lowest Amount</option>
                    </select>
                    <input type="month" id="filter-month" onchange="fetchTransactions()">
                </div>

                <div class="table-responsive">
                    <table id="transactions-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Transaction Modal -->
    <div class="modal-overlay" id="addTransactionModal">
        <div class="modal-content">
            <i class="fas fa-times close-modal" onclick="closeModal('addTransactionModal')"></i>
            <h2 id="modal-title">Add Transaction</h2>
            <form id="transaction-form">
                <input type="hidden" id="transaction-id">
                <div class="form-group">
                    <label>Type</label>
                    <select id="trans-type" class="form-control" required onchange="populateCategories()">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="trans-category" class="form-control" required>
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" step="0.01" id="trans-amount" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="trans-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description (Optional)</label>
                    <input type="text" id="trans-desc" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Save Transaction</button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/common.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
